<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能量图谱 · 冰山下的性格解码</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a1a;
    --ink2: #4a4a4a;
    --ink3: #8a8a8a;
    --ink4: #b8b8b8;
    --bg: #fafaf8;
    --bg2: #f2f1ee;
    --bg3: #e8e7e3;
    --border: #e0deda;
    --gold: #9a7a3a;
    --gold-light: #f5edd6;
    --fire: #c94a2a;
    --water: #2a5fac;
    --wood: #3a7a3a;
    --metal: #6a6a6a;
    --earth: #8a6a2a;
    --purple: #5a4a9a;
    --purple-light: #eeedfe;
    --green-light: #e1f5ee;
    --green: #0f6e56;
    --amber-light: #faeeda;
    --amber: #854f0b;
    --coral-light: #faece7;
    --coral: #993c1d;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── INPUT SCREEN ── */
  #s-input {
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .brand { text-align: center; margin-bottom: 3rem; }

  .brand-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
  }

  .brand-line { width: 32px; height: 1px; background: var(--gold); margin: 0.75rem auto; }

  .brand-sub { font-size: 13px; color: var(--ink3); letter-spacing: 0.06em; }

  .form-box { width: 100%; max-width: 440px; }

  .field-label {
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }

  .pillar-section { margin-bottom: 2rem; }

  .pillar-hint {
    font-size: 12px;
    color: var(--ink3);
    text-align: center;
    margin-bottom: 1rem;
    line-height: 1.7;
  }

  .pillars-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 10px;
  }

  .pillar-col { text-align: center; }

  .pillar-name { font-size: 11px; color: var(--ink3); margin-bottom: 6px; letter-spacing: 0.04em; }

  .gz-inputs { display: flex; flex-direction: column; gap: 5px; }

  .gz-row-label { font-size: 10px; color: var(--ink4); margin-bottom: 2px; text-align: left; padding-left: 2px; }

  .gz-input {
    width: 100%;
    text-align: center;
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    padding: 10px 4px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .gz-input:focus { border-color: var(--gold); background: var(--gold-light); }
  .gz-input.valid { border-color: #3a7a3a; }
  .gz-input.invalid { border-color: var(--coral); }

  .example-hint {
    font-size: 11px;
    color: var(--ink4);
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .example-hint span {
    display: inline-block;
    background: var(--bg2);
    padding: 4px 10px;
    border-radius: 99px;
    cursor: pointer;
    transition: background 0.2s;
    margin: 2px;
  }

  .example-hint span:hover { background: var(--bg3); }

  .btn-analyze {
    width: 100%;
    padding: 15px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-analyze:hover { opacity: 0.85; }
  .btn-analyze:active { transform: scale(0.99); }
  .btn-analyze:disabled { opacity: 0.35; cursor: not-allowed; }

  .err-msg {
    margin-top: 1rem;
    padding: 12px 14px;
    background: var(--coral-light);
    border-radius: 8px;
    font-size: 13px;
    color: var(--coral);
    line-height: 1.6;
    display: none;
  }

  /* ── LOADING SCREEN ── */
  #s-loading { align-items: center; justify-content: center; text-align: center; padding: 2rem; }

  .loading-glyph {
    font-family: 'Noto Serif SC', serif;
    font-size: 64px;
    color: var(--gold);
    animation: breathe 2s ease-in-out infinite;
    margin-bottom: 2rem;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.2; transform: scale(0.95); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .loading-steps { display: flex; flex-direction: column; gap: 10px; }

  .loading-step {
    font-size: 13px;
    color: var(--ink4);
    transition: color 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .loading-step.active { color: var(--ink2); }
  .loading-step.done { color: var(--gold); }

  .step-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  /* ── RESULT SCREEN ── */
  #s-result { padding: 0; }

  .result-inner { max-width: 600px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

  .result-header { text-align: center; padding: 1.5rem 0 2rem; }

  .pillars-display {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .pd-cell {
    text-align: center;
    background: var(--bg2);
    border-radius: 8px;
    padding: 10px 4px;
    border: 1px solid var(--border);
  }

  .pd-label { font-size: 10px; color: var(--ink3); margin-bottom: 4px; }
  .pd-gz { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--ink); line-height: 1.5; }

  .result-gejuming {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .result-badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 0.5rem; }

  .rbadge {
    display: inline-block;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid var(--gold);
    color: var(--gold);
    letter-spacing: 0.04em;
  }

  .rbadge.rare { background: var(--gold-light); font-weight: 500; }

  .result-line { width: 32px; height: 1px; background: var(--gold); margin: 1rem auto 0; }

  /* Cards */
  .rcard {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 0.875rem;
  }

  .rcard-title {
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1.1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rcard-title::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--border);
  }

  /* Energy bars */
  .ebar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 0.5px solid var(--bg2);
  }

  .ebar-row:last-child { border-bottom: none; }

  .ebar-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 600;
    width: 22px;
    text-align: center;
  }

  .ebar-wrap {
    flex: 1;
    height: 6px;
    background: var(--bg2);
    border-radius: 3px;
    overflow: hidden;
  }

  .ebar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .ebar-pct { font-size: 12px; color: var(--ink3); width: 34px; text-align: right; }

  /* Util */
  .util-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 9px 0;
    border-bottom: 0.5px solid var(--bg2);
    font-size: 13px;
    gap: 12px;
  }

  .util-row:last-child { border-bottom: none; }
  .util-label { color: var(--ink2); flex-shrink: 0; }
  .util-val { font-weight: 500; color: var(--ink); text-align: right; }

  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .tag-low { background: var(--green-light); color: var(--green); }
  .tag-mid { background: var(--amber-light); color: var(--amber); }
  .tag-high { background: var(--coral-light); color: var(--coral); }
  .tag-xianhua { background: var(--purple-light); color: var(--purple); }
  .tag-he { background: var(--green-light); color: var(--green); }
  .tag-chong { background: var(--amber-light); color: var(--amber); }
  .tag-qianli { background: var(--bg2); color: var(--ink3); border: 0.5px solid var(--border); }
  .tag-kongbai { background: var(--bg2); color: var(--ink4); }

  /* Shishen */
  .ss-row { padding: 10px 0; border-bottom: 0.5px solid var(--bg2); }
  .ss-row:last-child { border-bottom: none; padding-bottom: 0; }

  .ss-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .ss-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .ss-tags { display: flex; gap: 5px; align-items: center; }
  .ss-pct { font-size: 12px; color: var(--ink3); }

  .ss-bar-wrap {
    height: 4px;
    background: var(--bg2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 5px;
  }

  .ss-bar-fill {
    height: 100%;
    background: var(--ink3);
    border-radius: 2px;
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .ss-note { font-size: 11px; color: var(--ink3); }

  /* Gongzuo */
  .gz-item-r { padding: 12px 0; border-bottom: 0.5px solid var(--bg2); }
  .gz-item-r:last-child { border-bottom: none; padding-bottom: 0; }

  .gz-item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

  .gz-zuhe {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }

  .gz-direction { font-size: 12px; color: var(--ink3); }
  .gz-desc { font-size: 13px; color: var(--ink2); line-height: 1.7; }

  /* Narrative */
  .narrative { font-size: 15px; line-height: 2; color: var(--ink); }

  /* Bottom actions */
  .bottom-actions { display: flex; gap: 8px; margin-top: 1.5rem; }

  .btn-action {
    flex: 1;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: white;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--ink2);
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-action:hover { background: var(--bg2); }

  .btn-restart {
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: white;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--ink3);
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-restart:hover { background: var(--bg2); }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── RESPONSIVE ── */
  @media (max-width: 400px) {
    .gz-input { font-size: 18px; padding: 9px 2px; }
    .brand-title { font-size: 26px; }
  }
</style>
</head>
<body>

<!-- INPUT -->
<div class="screen active" id="s-input">
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;">
    <div class="form-box">
      <div class="brand">
        <div class="brand-title">能量图谱</div>
        <div class="brand-line"></div>
        <div class="brand-sub">冰山下的性格能量解码</div>
      </div>

      <div class="pillar-section">
        <label class="field-label">四柱八字</label>
        <div class="pillar-hint">输入你的八字，天干地支各一格<br>不知道八字？先查万年历</div>
        <div class="pillars-grid">
          <div class="pillar-col">
            <div class="pillar-name">年柱</div>
            <div class="gz-inputs">
              <div class="gz-row-label">天干</div>
              <input class="gz-input" id="n-tg" maxlength="1" placeholder="甲">
              <div class="gz-row-label">地支</div>
              <input class="gz-input" id="n-dz" maxlength="1" placeholder="寅">
            </div>
          </div>
          <div class="pillar-col">
            <div class="pillar-name">月柱</div>
            <div class="gz-inputs">
              <div class="gz-row-label">天干</div>
              <input class="gz-input" id="y-tg" maxlength="1" placeholder="己">
              <div class="gz-row-label">地支</div>
              <input class="gz-input" id="y-dz" maxlength="1" placeholder="巳">
            </div>
          </div>
          <div class="pillar-col">
            <div class="pillar-name">日柱</div>
            <div class="gz-inputs">
              <div class="gz-row-label">天干</div>
              <input class="gz-input" id="r-tg" maxlength="1" placeholder="丙">
              <div class="gz-row-label">地支</div>
              <input class="gz-input" id="r-dz" maxlength="1" placeholder="子">
            </div>
          </div>
          <div class="pillar-col">
            <div class="pillar-name">时柱</div>
            <div class="gz-inputs">
              <div class="gz-row-label">天干</div>
              <input class="gz-input" id="s-tg" maxlength="1" placeholder="壬">
              <div class="gz-row-label">地支</div>
              <input class="gz-input" id="s-dz" maxlength="1" placeholder="辰">
            </div>
          </div>
        </div>
        <div class="example-hint">
          示例：
          <span onclick="fillExample('甲','寅','己','巳','丙','子','壬','辰')">甲寅 己巳 丙子 壬辰</span>
        </div>
      </div>

      <button class="btn-analyze" id="btn-go" onclick="startAnalysis()">解读我的能量图谱</button>
      <div class="err-msg" id="err-msg"></div>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="screen" id="s-loading">
  <div class="loading-glyph" id="l-glyph">命</div>
  <div class="loading-steps">
    <div class="loading-step" id="ls-1"><div class="step-dot"></div>排盘 · 定日主</div>
    <div class="loading-step" id="ls-2"><div class="step-dot"></div>计算先天能量底色</div>
    <div class="loading-step" id="ls-3"><div class="step-dot"></div>推演做工关系与动能转化</div>
    <div class="loading-step" id="ls-4"><div class="step-dot"></div>生成能量解读</div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="s-result">
  <div class="result-inner" id="result-inner"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const TG = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DZ = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const WX_COLOR = { 火:'#c94a2a', 水:'#2a5fac', 木:'#3a7a3a', 金:'#6a6a6a', 土:'#8a6a2a' };

let savedResult = null;

function fillExample(ntg,ndz,ytg,ydz,rtg,rdz,stg,sdz) {
  document.getElementById('n-tg').value = ntg;
  document.getElementById('n-dz').value = ndz;
  document.getElementById('y-tg').value = ytg;
  document.getElementById('y-dz').value = ydz;
  document.getElementById('r-tg').value = rtg;
  document.getElementById('r-dz').value = rdz;
  document.getElementById('s-tg').value = stg;
  document.getElementById('s-dz').value = sdz;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function validate() {
  const fields = [
    {id:'n-tg', list: TG}, {id:'n-dz', list: DZ},
    {id:'y-tg', list: TG}, {id:'y-dz', list: DZ},
    {id:'r-tg', list: TG}, {id:'r-dz', list: DZ},
    {id:'s-tg', list: TG}, {id:'s-dz', list: DZ},
  ];
  for (const f of fields) {
    const v = document.getElementById(f.id).value.trim();
    if (!v || !f.list.includes(v)) return false;
  }
  return true;
}

function getInputs() {
  return {
    nTG: document.getElementById('n-tg').value.trim(),
    nDZ: document.getElementById('n-dz').value.trim(),
    yTG: document.getElementById('y-tg').value.trim(),
    yDZ: document.getElementById('y-dz').value.trim(),
    rTG: document.getElementById('r-tg').value.trim(),
    rDZ: document.getElementById('r-dz').value.trim(),
    sTG: document.getElementById('s-tg').value.trim(),
    sDZ: document.getElementById('s-dz').value.trim(),
  };
}

let loadTimer = null;
function startLoadingAnim() {
  const glyphs = ['命','格','局','象','道','气','运','化','玄','机'];
  const steps = ['ls-1','ls-2','ls-3','ls-4'];
  let gi = 0, si = 0;
  document.getElementById('l-glyph').textContent = glyphs[0];
  steps.forEach(s => document.getElementById(s).className = 'loading-step');
  document.getElementById(steps[0]).classList.add('active');
  loadTimer = setInterval(() => {
    gi = (gi + 1) % glyphs.length;
    document.getElementById('l-glyph').textContent = glyphs[gi];
    if (gi % 3 === 0 && si < steps.length - 1) {
      document.getElementById(steps[si]).classList.remove('active');
      document.getElementById(steps[si]).classList.add('done');
      si++;
      document.getElementById(steps[si]).classList.add('active');
    }
  }, 700);
}

function stopLoadingAnim() {
  if (loadTimer) clearInterval(loadTimer);
  ['ls-1','ls-2','ls-3','ls-4'].forEach(s => {
    document.getElementById(s).classList.remove('active');
    document.getElementById(s).classList.add('done');
  });
}

async function callAPI(inputs) {
  const bazi = `年柱${inputs.nTG}${inputs.nDZ} 月柱${inputs.yTG}${inputs.yDZ} 日柱${inputs.rTG}${inputs.rDZ} 时柱${inputs.sTG}${inputs.sDZ}`;
  const resp = await fetch('/api/analyze?ts=' + Date.now(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bazi }),
    cache: 'no-store'
  });
  let payload = '';
  try { payload = await resp.text(); } catch (e) { payload = ''; }
  let data = {};
  try { data = payload ? JSON.parse(payload) : {}; } catch (e) {
    data = { error: '服务器返回的分析结果不是有效 JSON，请稍后再试。' };
  }
  if (!resp.ok || data.error) {
    throw new Error(data.error || data.hint || `HTTP ${resp.status}`);
  }
  // 兼容 result 为对象或 JSON 字符串两种形态
  let r = data.result || {};
  if (typeof r === 'string') {
    try { r = JSON.parse(r); } catch (e) { r = {}; }
  }
  return r;
}

async function startAnalysis() {
  const errEl = document.getElementById('err-msg');
  errEl.style.display = 'none';

  if (!validate()) {
    errEl.textContent = '请检查八字输入——天干：甲乙丙丁戊己庚辛壬癸；地支：子丑寅卯辰巳午未申酉戌亥';
    errEl.style.display = 'block';
    return;
  }

  const inputs = getInputs();
  showScreen('s-loading');
  startLoadingAnim();

  try {
    const result = await callAPI(inputs);
    savedResult = { result, inputs };
    stopLoadingAnim();
    renderResult(result, inputs);
    showScreen('s-result');
    window.scrollTo(0, 0);
  } catch (e) {
    stopLoadingAnim();
    showScreen('s-input');
    errEl.textContent = '解析出错：' + (e.message || '未知错误') + '，请稍后重试。';
    errEl.style.display = 'block';
  }
}

function render_badge_class(zhuangtai, jihuo_type) {
  if (jihuo_type === '合激活') return 'tag-he';
  if (jihuo_type === '冲激活') return 'tag-chong';
  if (zhuangtai === '已显化') return 'tag-xianhua';
  if (zhuangtai === '潜力') return 'tag-qianli';
  return 'tag-kongbai';
}

function render_badge_text(zhuangtai, jihuo_type) {
  if (jihuo_type === '合激活') return '合激活·持续稳定';
  if (jihuo_type === '冲激活') return '冲激活·脉冲爆发';
  if (zhuangtai === '已显化') return '已显化·前30%';
  if (zhuangtai === '潜力') return '潜力待激活';
  return '缺失';
}

function renderResult(r, inputs) {
  // 防御性补全（历史教训：所有数组/对象字段都要兜底）
  const wuxing = r.wuxing || {};
  const neihao = r.neihao || { zhi: 0, dengji: '', yuanyin: '' };
  const gongzuo = r.gongzuo || {};
  const liyong = Math.round((r.nengliang_liyong || 0) * 100);
  const neihaoPct = Math.round((neihao.zhi || 0) * 100);
  const tagCls = neihao.dengji === '低内耗' ? 'tag-low' : neihao.dengji === '中内耗' ? 'tag-mid' : 'tag-high';
  const wxEntries = Object.entries(wuxing).sort((a, b) => b[1] - a[1]);
  const maxWx = wxEntries[0]?.[1] || 0.001;
  const ssList = (Array.isArray(r.shishen_list) ? r.shishen_list : []).filter(s => s && s.defen > 0).sort((a, b) => b.defen - a.defen);
  const maxSS = ssList[0]?.defen || 0.001;
  const he = (Array.isArray(gongzuo.he) ? gongzuo.he : []).filter(h => h && h.zuhe);
  const chongTG = (Array.isArray(gongzuo.chong_tg) ? gongzuo.chong_tg : []).filter(c => c && c.zuhe);
  const chongDZ = (Array.isArray(gongzuo.chong_dz) ? gongzuo.chong_dz : []).filter(c => c && c.zuhe);
  const kongbai = Array.isArray(r.kongbai) ? r.kongbai : [];
  const zhuxian = Array.isArray(r.shengke_zhuxian) ? r.shengke_zhuxian : [];
  const xitong = Array.isArray(r.xitong_list) ? r.xitong_list : [];

  document.getElementById('result-inner').innerHTML = `
    <div class="result-header">
      <div class="pillars-display">
        ${[['年柱',inputs.nTG,inputs.nDZ],['月柱',inputs.yTG,inputs.yDZ],['日柱',inputs.rTG,inputs.rDZ],['时柱',inputs.sTG,inputs.sDZ]]
          .map(([l,tg,dz]) => `<div class="pd-cell"><div class="pd-label">${l}</div><div class="pd-gz">${tg}<br>${dz}</div></div>`).join('')}
      </div>
      <div class="result-gejuming">${r.wanzheng_geju || r.gejuming || ''}</div>
      <div class="result-badges">
        <span class="rbadge">${r.qudongmoshi || ''}</span>
        <span class="rbadge">${r.gejuli || ''}</span>
        <span class="rbadge">日主 ${r.rizhu || ''} · ${r.rizhu_qiangruo || ''}</span>
      </div>
      ${r.xiduyou ? `<div class="result-badges"><span class="rbadge rare">${r.xiduyou}</span></div>` : ''}
      <div class="result-line"></div>
    </div>

    <div class="rcard">
      <div class="rcard-title">先天能量底色</div>
      ${wxEntries.map(([name, val]) => `
        <div class="ebar-row">
          <div class="ebar-name" style="color:${WX_COLOR[name] || '#6a6a6a'}">${name}</div>
          <div class="ebar-wrap">
            <div class="ebar-fill" style="width:${Math.round(val/maxWx*100)}%;background:${WX_COLOR[name] || '#6a6a6a'}"></div>
          </div>
          <div class="ebar-pct">${Math.round(val*100)}%</div>
        </div>`).join('')}
      ${kongbai.length > 0 ? `<div style="margin-top:10px;font-size:12px;color:var(--ink4)">空白缺失：${kongbai.join('、')}</div>` : ''}
    </div>

    <div class="rcard">
      <div class="rcard-title">能量利用率 · 内耗</div>
      <div class="util-row">
        <span class="util-label">能量利用率</span>
        <span class="util-val">${liyong}%</span>
      </div>
      <div class="util-row">
        <span class="util-label">内耗值</span>
        <span class="util-val">${neihaoPct}% <span class="tag ${tagCls}">${neihao.dengji}</span></span>
      </div>
      <div class="util-row">
        <span class="util-label">内耗来源</span>
        <span class="util-val" style="font-weight:400;color:var(--ink2)">${neihao.yuanyin}</span>
      </div>
      ${zhuxian.length ? `
      <div class="util-row">
        <span class="util-label">生克主线</span>
        <span class="util-val" style="font-weight:400;color:var(--ink2)">${zhuxian.join(' → ')}</span>
      </div>` : ''}
    </div>

    <div class="rcard">
      <div class="rcard-title">十神驱动力 · 实际能力</div>
      ${ssList.map(s => `
        <div class="ss-row">
          <div class="ss-top">
            <span class="ss-name">${s.shishen}<span style="font-size:11px;color:var(--ink4);font-weight:400;margin-left:6px">${s.zhu || ''}${s.gan || ''}</span></span>
            <div class="ss-tags">
              <span class="tag ${render_badge_class(s.zhuangtai, s.jihuo_type)}">${render_badge_text(s.zhuangtai, s.jihuo_type)}</span>
              <span class="ss-pct">${Math.round(s.defen*100)}%</span>
            </div>
          </div>
          <div class="ss-bar-wrap">
            <div class="ss-bar-fill" style="width:${Math.round(s.defen/maxSS*100)}%"></div>
          </div>
          <div class="ss-note">${s.laiyuan === '天干透出' ? '天干透出 · ' : ''}人群${s.renqun || ''}</div>
        </div>`).join('')}
    </div>

    ${(he.length > 0 || chongTG.length > 0 || chongDZ.length > 0 || xitong.length > 0) ? `
    <div class="rcard">
      <div class="rcard-title">做工关系 · 动能转化</div>
      ${xitong.length ? `<div class="util-row"><span class="util-label">做工系统</span><span class="util-val">${xitong.join(' + ')}</span></div>` : ''}
      ${he.map(h => `
        <div class="gz-item-r">
          <div class="gz-item-header">
            <span class="gz-zuhe">${h.zuhe}</span>
            <span class="tag tag-he">合 · 持续稳定</span>
          </div>
          <div class="gz-direction" style="margin-bottom:5px">${h.gaoneng_ss} 带动 ${h.dineng_ss}</div>
          <div class="gz-desc">${h.fuzhetezhi}</div>
        </div>`).join('')}
      ${chongTG.map(c => `
        <div class="gz-item-r">
          <div class="gz-item-header">
            <span class="gz-zuhe">${c.zuhe}</span>
            <span class="tag tag-chong">冲 · 脉冲爆发</span>
          </div>
          <div class="gz-direction" style="margin-bottom:5px">${c.zhudong_ss} 主动冲击 ${c.beidong_ss}</div>
          <div class="gz-desc">${c.biaoxian}</div>
        </div>`).join('')}
      ${chongDZ.map(c => `
        <div class="gz-item-r">
          <div class="gz-item-header">
            <span class="gz-zuhe">${c.zuhe}</span>
            <span class="tag tag-qianli">地支冲 · 做工不稳</span>
          </div>
          <div class="gz-desc">${c.yingxiang}</div>
        </div>`).join('')}
    </div>` : ''}

    <div class="rcard">
      <div class="rcard-title">能量解读</div>
      <div class="narrative">${r.jieda || ''}</div>
    </div>

    <div class="bottom-actions">
      <button class="btn-action" onclick="copyResult()">复制解读</button>
      <button class="btn-action" onclick="shareText()">分享图谱</button>
      <button class="btn-restart" onclick="restart()">重测</button>
    </div>`;
}

function copyResult() {
  if (!savedResult) return;
  const r = savedResult.result;
  const i = savedResult.inputs;
  const text = `【能量图谱】${i.nTG}${i.nDZ} ${i.yTG}${i.yDZ} ${i.rTG}${i.rDZ} ${i.sTG}${i.sDZ}\n\n格局：${r.wanzheng_geju || r.gejuming}\n能量利用率：${Math.round(r.nengliang_liyong*100)}% · ${r.neihao.dengji}\n\n${r.jieda}`;
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
}

function shareText() {
  if (!savedResult) return;
  const r = savedResult.result;
  const text = `我的能量图谱：${r.wanzheng_geju || r.gejuming}\n\n${(r.jieda || '').slice(0, 100)}...`;
  if (navigator.share) {
    navigator.share({ title: '能量图谱', text });
  } else {
    navigator.clipboard.writeText(text).then(() => showToast('已复制分享内容'));
  }
}

function restart() {
  savedResult = null;
  document.getElementById('err-msg').style.display = 'none';
  showScreen('s-input');
  window.scrollTo(0, 0);
}

// Auto-validate inputs
['n-tg','y-tg','r-tg','s-tg'].forEach(id => {
  document.getElementById(id).addEventListener('input', function() {
    this.classList.toggle('valid', TG.includes(this.value));
    this.classList.toggle('invalid', this.value && !TG.includes(this.value));
  });
});

['n-dz','y-dz','r-dz','s-dz'].forEach(id => {
  document.getElementById(id).addEventListener('input', function() {
    this.classList.toggle('valid', DZ.includes(this.value));
    this.classList.toggle('invalid', this.value && !DZ.includes(this.value));
  });
});
</script>
</body>
</html>
